<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flipkart Clone</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo" onclick="showHome()">Flipkart</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search for products..." onkeyup="searchProducts()" />
      <i class="fas fa-search"></i>
    </div>
    <div class="nav-icons">
      <div class="cart-icon" onclick="showCart()">
        <i class="fas fa-shopping-cart"></i>
        <span id="cartCount">0</span>
      </div>
    </div>
  </nav>

  <!-- Home / Products -->
  <div id="homePage" class="page">
    <div class="container">
      <h2 class="section-title">All Products</h2>
      <div id="productGrid" class="product-grid"></div>
    </div>
  </div>

  <!-- Product Detail -->
  <div id="detailPage" class="page hidden">
    <div class="container">
      <button class="back-btn" onclick="showHome()"><i class="fas fa-arrow-left"></i> Back</button>
      <div id="productDetail" class="product-detail"></div>
    </div>
  </div>

  <!-- Cart Page -->
  <div id="cartPage" class="page hidden">
    <div class="container">
      <button class="back-btn" onclick="showHome()"><i class="fas fa-arrow-left"></i> Back</button>
      <h2 class="section-title">My Cart</h2>
      <div id="cartItems"></div>
      <div id="cartSummary" class="cart-summary hidden">
        <div class="total-row">
          <span>Total:</span>
          <span id="cartTotal">₹0</span>
        </div>
        <button class="place-order-btn" onclick="placeOrder()">Place Order</button>
      </div>
      <div id="emptyCart" class="empty-cart">
        <i class="fas fa-shopping-cart"></i>
        <p>Your cart is empty</p>
      </div>
    </div>
  </div>

  <!-- Order Success -->
  <div id="successPage" class="page hidden">
    <div class="success-box">
      <i class="fas fa-check-circle"></i>
      <h2>Order Placed Successfully!</h2>
      <p>Thank you for shopping with us.</p>
      <button onclick="showHome()">Continue Shopping</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
